buildscript {
    repositories {
        mavenCentral()
        jcenter()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
	maven {
	    name = "gradle"
	    url "https://plugins.gradle.org/m2/"
	}
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2+'
    }
}

plugins {
  id 'com.matthewprenger.cursegradle' version '1.0.9'
  id 'net.saliman.cobertura' version '2.2.5'
  id 'com.github.kt3k.coveralls' version '2.0.1'
  id "se.bjurr.gitchangelog.git-changelog-gradle-plugin" version "1.45"
}

apply plugin: 'scala'
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'com.github.kt3k.coveralls'
apply plugin: 'jacoco'

targetCompatibility = '1.8'
sourceCompatibility = '1.8'

dependencies 
{
    testCompile 'junit:junit:4.11'
}

def jarMf = {
            attributes "Implementation-Title": archivesBaseName
            attributes "Implementation-Version": project.version
            attributes "FMLAT": "AI_at.cfg"
}

jacocoTestReport {
    reports {
        xml.enabled = true // coveralls plugin depends on xml format report
        html.enabled = true
    }
}

//Adds variable for getting build numbers       
ext.getBuildNumber = {
    if (System.getenv("BUILD_NUMBER") != null) 
    {
        return "${System.getenv("BUILD_NUMBER")}"
    }
    else if (project.hasProperty("bambooBuildNumber")) 
    {
        return project.bambooBuildNumber
    }
    else if (System.getenv("DRONE_BUILD_NUMBER") != null) 
    {
        return "${System.getenv("DRONE_BUILD_NUMBER")}"
    }
    else if (System.getenv("TRAVIS_BUILD_NUMBER") != null) 
    {
        return "${System.getenv("TRAVIS_BUILD_NUMBER")}"
    }
    else if (project.hasProperty("sbmBuild"))
    {
        return project.sbmBuild
    }
    return "0"
}

javadoc {
    source = sourceSets.main.allJava
}

version = "${version_major}.${version_minor}.${version_revis}." + project.getBuildNumber()

group = "com.${org}.${groupid}"
archivesBaseName = "${archivebase}"
def forgeV = minecraft.forgeVersion

minecraft {
    version = "1.12-14.21.1.2426"
    runDir = "run"
    mappings = "snapshot_20170727"
    replace "@MAJOR@", version_major
    replace "@MINOR@", version_minor
    replace "@REVIS@", version_revis
    replace "@BUILD@", project.getBuildNumber()
	replace "required-after:Forge", "required-after:Forge@[$forgeV,)"
}

repositories {
    mavenCentral()
    jcenter()
    maven {
            name = "tterrag"
            url = "https://maven.tterrag.com/"
    }
    maven {
        name 'CB Repo'
        url "https://chickenbones.net/maven/"
    }
    maven { 
        name 'OC Maven'
        url = "https://maven.cil.li/" 
    }
    maven {
        name = "IGW"
        url = "https://maven.k-4u.nl/"
    }
    maven {
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven'
    }
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    inputs.property "modname", project.archivebase
    inputs.property "url", "https://builtbroken.com/"
    inputs.property "description", project.description

    // replace stuff in mcmod.info, nothing else
	from(sourceSets.main.resources.srcDirs) {
		//include '**/*.lang'
		include '**/*.info'
		include '**/*.properties'
  
        expand([
                'version'    : project.version,
                'mcversion'  : project.minecraft.version,
                'description': project.description,
                'url'        : "https://builtbroken.com/",
                'modname'    : project.archivebase
                ])
	}
    
	// copy everything else, thats not text
	from(sourceSets.main.resources.srcDirs) {
		exclude '**/*.info'
		exclude '**/*.properties'
	}
}

task javadocJar(type: Jar, dependsOn: 'javadoc') {
     from javadoc.destinationDir
     classifier = "javadoc"
     mustRunAfter "sourceMainScala"
}

task deobfJar(type: Jar) {
     from sourceSets.main.output
     //if project name is BBM-Dev it makes the deobf jar deobf-dev if not its just deobf
     classifier = "deobf"
     manifest jarMf
     mustRunAfter "jar" 
}

task sourcesJar(type: Jar) {
     from sourceSets.main.allJava
     classifier = "sources"
     manifest jarMf
     mustRunAfter "jar"
}

jar {
     classifier = "universal"
     manifest jarMf
}

// Tell the artifact system about our extra jars
artifacts {
	archives javadocJar
    archives deobfJar
	archives sourcesJar
	archives sourceJar
	archives jar
}

